[project]
name = "renpy-mcp"
version = "1.1.2"
description = "MCP server and visual development tools for Ren'Py visual novel engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "y1" }]
dependencies = [
    "mcp[cli]>=1.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
renpy-mcp = "renpy_mcp.server:main"
renpy-webui = "renpy_mcp.web.standalone:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renpy_mcp"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
