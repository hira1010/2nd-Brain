<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Heroine Clicker - Twine Edition</title>
<style>
/* プレミアムUIデザイン */
body {
    background: #000;
    color: #e0e0e0;
    font-family: 'Outfit', 'Inter', sans-serif;
    margin: 0;
    overflow: hidden;
    background-image: url('images/bg_classroom.png');
    background-size: cover;
    background-position: center;
}

#ui-bar {
    width: 250px;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(15px);
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    padding: 20px;
    height: 100vh;
    position: fixed;
    left: 0;
    z-index: 100;
}

#passages {
    margin-left: 250px;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-end;
}

.heroine-container {
    position: relative;
    width: auto;
    height: 90vh;
    display: flex;
    justify-content: center;
    align-items: flex-end;
}

.heroine-image {
    height: 100%;
    width: auto;
    filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.7));
    user-select: none;
    pointer-events: none;
}

/* 当たり判定エリア - 完全に透明に修正 */
.click-area {
    position: absolute;
    cursor: pointer;
    background: transparent; /* ピンクの円を見えないように修正 */
    border-radius: 50%;
    z-index: 10;
}

/* ホバー時の反応も極限まで薄く (フィードバック用) */
.click-area:hover {
    background: rgba(255, 255, 255, 0.05);
}

.label-status {
    font-size: 1.1rem;
    font-weight: bold;
    color: #ff80ab;
    margin-bottom: 5px;
}

.gauge-bg {
    width: 100%;
    height: 12px;
    background: #222;
    border-radius: 6px;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
}

.gauge-fill {
    height: 100%;
    background: linear-gradient(to right, #ff4081, #f50057);
    transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.main-button {
    width: 100%;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    border: none;
    color: white;
    padding: 12px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
    transition: all 0.2s;
    margin-bottom: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.main-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

.photo-button {
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
    color: #333;
}

/* フラッシュ演出 */
#flash-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 500;
}

.flash-anim {
    animation: flash-frame 0.5s ease-out;
}

@keyframes flash-frame {
    0% { opacity: 1; }
    100% { opacity: 0; }
}

@keyframes heart-float {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    100% { transform: translate(-50%, -150%) scale(1.8); opacity: 0; }
}

.effect-heart {
    position: absolute;
    width: 40px;
    pointer-events: none;
    z-index: 1000;
    animation: heart-float 0.8s ease-out forwards;
}

#shop-overlay {
    position: fixed;
    top: 0;
    left: 250px;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
}

.shop-content {
    background: #1a1a2e;
    padding: 40px;
    border-radius: 20px;
    border: 2px solid #2575fc;
    max-width: 500px;
    width: 90%;
}

.item-card {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.buy-btn {
    background: #2575fc;
    border: none;
    color: white;
    padding: 8px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.buy-btn:disabled {
    background: #444;
    cursor: not-allowed;
}
</style>
</head>
<body>

<div id="flash-overlay"></div>

<div id="ui-bar">
    <h2 style="color: #fff; text-align: center; margin-bottom: 30px;">Heroine Clicker</h2>
    <div class="label-status">親密度 (Love): <span id="val-love">0</span></div>
    <div class="gauge-bg"><div id="gauge-love" class="gauge-fill" style="width: 0%;"></div></div>
    
    <div class="label-status">快感度 (Pleasure): <span id="val-pleasure">0</span>%</div>
    <div class="gauge-bg"><div id="gauge-pleasure" class="gauge-fill" style="width: 0%;"></div></div>
    
    <div class="label-status">所持金: <span id="val-gold">0</span> G</div>
    
    <div style="margin-top: 40px;">
        <button id="btn-photo" class="main-button photo-button" onclick="takePhoto()">📷 チェキを撮る</button>
        <button class="main-button" onclick="openShop()">🛒 秘密のショップ</button>
    </div>
</div>

<div id="passages">
    <div class="heroine-container" id="game-view">
        <img id="heroine-img" src="images/heroine_rank1.png" class="heroine-image">
        
        <!-- クリックエリア (当たり判定) -->
        <div class="click-area" style="top: 15%; left: 55%; width: 12%; height: 10%;" title="耳" onclick="handleClick('ear', event)"></div>
        <div class="click-area" style="top: 38%; left: 40%; width: 25%; height: 20%;" title="胸" onclick="handleClick('chest', event)"></div>
        <div class="click-area" style="top: 65%; left: 45%; width: 18%; height: 20%;" title="股間" onclick="handleClick('crotch', event)"></div>
    </div>
</div>

<div id="shop-overlay">
    <div class="shop-content">
        <h2 style="margin-top:0;">秘密のショップ</h2>
        <p>所持金: <span id="shop-gold">0</span> G</p>
        <div id="item-list">
            <div class="item-card">
                <div>
                    <strong>低周波バイブ</strong><br>
                    <small>快感度上昇 2倍 (5,000G)</small>
                </div>
                <button class="buy-btn" id="btn-vibe" onclick="buyItem('vibe', 5000)">購入</button>
            </div>
            <div class="item-card">
                <div>
                    <strong>強力マッサージ器</strong><br>
                    <small>快感度上昇 4倍 (20,000G)</small>
                </div>
                <button class="buy-btn" id="btn-super-vibe" onclick="buyItem('super_vibe', 20000)">購入</button>
            </div>
            <div class="item-card">
                <div>
                    <strong>高級アロマオイル</strong><br>
                    <small>親密度上昇 3倍 (15,000G)</small>
                </div>
                <button class="buy-btn" id="btn-oil" onclick="buyItem('oil', 15000)">購入</button>
            </div>
        </div>
        <button class="main-button" style="margin-top: 20px; background: #444;" onclick="closeShop()">戻る</button>
    </div>
</div>

<script>
// ゲーム変数
let love = 0;
let pleasure = 0;
let gold = 0;
let rank = 1;
let hasVibe = false;
let hasSuperVibe = false;
let hasOil = false;

// 音声初期化 (事前にロードして使い回すことで再生を確実に)
const voices = {
    ear: new Audio("audio/ear.ogg"),
    chest: new Audio("audio/chest.ogg"),
    crotch: new Audio("audio/crotch.ogg"),
    photo: new Audio("audio/vo_kyoko_surprise.ogg") // 撮影時のボイス
};

function updateUI() {
    document.getElementById('val-love').innerText = Math.floor(love);
    document.getElementById('gauge-love').style.width = Math.min(love / 10, 100) + '%';
    
    document.getElementById('val-pleasure').innerText = Math.floor(pleasure);
    document.getElementById('gauge-pleasure').style.width = Math.min(pleasure, 100) + '%';
    
    document.getElementById('val-gold').innerText = gold;
    document.getElementById('shop-gold').innerText = gold;
    
    // ランク更新
    if (love > 100) rank = 3;
    else if (love > 40) rank = 2;
    
    // アイテム購入済みのボタン無効化
    if (hasVibe) document.getElementById('btn-vibe').disabled = true;
    if (hasSuperVibe) document.getElementById('btn-super-vibe').disabled = true;
    if (hasOil) document.getElementById('btn-oil').disabled = true;
    
    // 表情切り替え
    let img = document.getElementById('heroine-img');
    if (pleasure >= 70) {
        img.src = "images/heroine_rank1_excited.png";
    } else if (pleasure >= 30) {
        img.src = "images/heroine_rank1_blush.png";
    } else {
        img.src = "images/heroine_rank1.png";
    }
}

function handleClick(part, event) {
    let loveGain = 1;
    let pleGain = 1;
    
    if (part === 'ear') { loveGain = 2; pleGain = 5; }
    if (part === 'chest') { loveGain = 5; pleGain = 10; }
    if (part === 'crotch') { loveGain = 10; pleGain = 20; }
    
    // アイテム補正
    if (hasOil) loveGain *= 3;
    if (hasSuperVibe) pleGain *= 4;
    else if (hasVibe) pleGain *= 2;
    
    love += loveGain;
    pleasure += pleGain;
    
    if (pleasure > 100) pleasure = 100;
    
    // 再生
    const sfx = voices[part];
    if (sfx) {
        sfx.currentTime = 0;
        sfx.play().catch(e => console.log("Audio need interaction first:", e));
    }
    
    updateUI();
    spawnEffect(event.clientX, event.clientY);
}

function takePhoto() {
    // 報酬計算 (Ren'Py版ロジック準拠)
    const basePrice = 1000 * (rank * rank);
    const bonus = pleasure >= 100 ? 1.5 : 1.0;
    const finalPrice = Math.floor(basePrice * bonus);
    
    gold += finalPrice;
    
    // 演出
    const flash = document.getElementById('flash-overlay');
    flash.classList.remove('flash-anim');
    void flash.offsetWidth; // reflow to restart animation
    flash.classList.add('flash-anim');
    
    // ボイス
    voices.photo.currentTime = 0;
    voices.photo.play().catch(e => {});
    
    // リセット
    pleasure = 0;
    updateUI();
}

function spawnEffect(x, y) {
    const heart = document.createElement('img');
    heart.src = 'images/effect_heart.png';
    heart.className = 'effect-heart';
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    document.body.appendChild(heart);
    setTimeout(() => { heart.remove(); }, 800);
}

function openShop() {
    document.getElementById('shop-overlay').style.display = 'flex';
}

function closeShop() {
    document.getElementById('shop-overlay').style.display = 'none';
}

function buyItem(id, cost) {
    if (gold >= cost) {
        gold -= cost;
        if (id === 'vibe') hasVibe = true;
        if (id === 'super_vibe') hasSuperVibe = true;
        if (id === 'oil') hasOil = true;
        updateUI();
    } else {
        alert('お金が足りません。');
    }
}

// 初期化
updateUI();
</script>

</body>
</html>
