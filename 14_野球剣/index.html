<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野球剣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <style>
        /* 同人ゲーム風のポップなタイトル文字装飾 */
        .doujin-title {
            font-family: 'Dela Gothic One', sans-serif;
            color: #FFFFFF;
            /* 白文字 + ピンクフチ + 茶色フチ のダブルアウトライン */
            text-shadow: 
                5px 5px 0 #FF6593, -5px -5px 0 #FF6593, 5px -5px 0 #FF6593, -5px 5px 0 #FF6593,
                0px 5px 0 #FF6593, 0px -5px 0 #FF6593, 5px 0px 0 #FF6593, -5px 0px 0 #FF6593,
                10px 10px 0 #4A2E1B, -10px -10px 0 #4A2E1B, 10px -10px 0 #4A2E1B, -10px 10px 0 #4A2E1B,
                0px 10px 0 #4A2E1B, 0px -10px 0 #4A2E1B, 10px 0px 0 #4A2E1B, -10px 0px 0 #4A2E1B,
                0px 15px 25px rgba(0,0,0,0.4);
            letter-spacing: 0.05em;
        }
        .doujin-title-sub {
            font-family: 'Dela Gothic One', sans-serif;
            color: #FFF000; /* ポップなイエロー */
            /* イエロー文字 + ピンクフチ + 茶色フチ のダブルアウトライン（少し細め） */
            text-shadow: 
                4px 4px 0 #FF6593, -4px -4px 0 #FF6593, 4px -4px 0 #FF6593, -4px 4px 0 #FF6593,
                0px 4px 0 #FF6593, 0px -4px 0 #FF6593, 4px 0px 0 #FF6593, -4px 0px 0 #FF6593,
                8px 8px 0 #4A2E1B, -8px -8px 0 #4A2E1B, 8px -8px 0 #4A2E1B, -8px 8px 0 #4A2E1B,
                0px 8px 0 #4A2E1B, 0px -8px 0 #4A2E1B, 8px 0px 0 #4A2E1B, -8px 0px 0 #4A2E1B,
                0px 10px 20px rgba(0,0,0,0.4);
        }
        .doujin-heading {
            font-family: 'Dela Gothic One', sans-serif;
            color: #FFFFFF;
            /* 少し細めのダブルアウトライン（見出し用） */
            text-shadow: 
                3px 3px 0 #FF6593, -3px -3px 0 #FF6593, 3px -3px 0 #FF6593, -3px 3px 0 #FF6593,
                0px 3px 0 #FF6593, 0px -3px 0 #FF6593, 3px 0px 0 #FF6593, -3px 0px 0 #FF6593,
                6px 6px 0 #4A2E1B, -6px -6px 0 #4A2E1B, 6px -6px 0 #4A2E1B, -6px 6px 0 #4A2E1B,
                0px 6px 0 #4A2E1B, 0px -6px 0 #4A2E1B, 6px 0px 0 #4A2E1B, -6px 0px 0 #4A2E1B,
                0px 10px 15px rgba(0,0,0,0.3);
            letter-spacing: 0.1em;
        }
        .doujin-label {
            font-family: 'Dela Gothic One', sans-serif;
            color: #FFFFFF;
            /* 小さめのダブルアウトライン（ラベル用） */
            text-shadow: 
                2px 2px 0 #FF6593, -2px -2px 0 #FF6593, 2px -2px 0 #FF6593, -2px 2px 0 #FF6593,
                0px 2px 0 #FF6593, 0px -2px 0 #FF6593, 2px 0px 0 #FF6593, -2px 0px 0 #FF6593,
                3px 3px 0 #4A2E1B, -3px -3px 0 #4A2E1B, 3px -3px 0 #4A2E1B, -3px 3px 0 #4A2E1B,
                0px 3px 0 #4A2E1B, 0px -3px 0 #4A2E1B, 3px 0px 0 #4A2E1B, -3px 0px 0 #4A2E1B,
                0px 5px 10px rgba(0,0,0,0.3);
            letter-spacing: 0.05em;
        }
        .doujin-frame {
            border: 4px solid #fff;
            border-radius: 12px;
            box-shadow: 
                0 0 0 4px #FF6593,
                0 0 0 8px #4A2E1B,
                0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .costume-option:hover .doujin-frame {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 
                0 0 0 4px #FF6593,
                0 0 0 8px #4A2E1B,
                0 15px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-pink-50 min-h-screen text-gray-800 font-sans overflow-hidden select-none">

    <!-- Splash Screen -->
    <div id="screen-splash" class="screen active flex-col items-center justify-center cursor-pointer bg-black w-full h-full z-50" onclick="showScreen('title')">
        <img src="content.png" alt="コンテンツ画像" class="max-w-full max-h-[80vh] object-contain shadow-xl rounded-2xl">
        <p class="mt-8 text-3xl font-bold text-pink-500 animate-pulse">画面をクリックしてスタート</p>
    </div>

    <!-- Title Screen -->
    <div id="screen-title" class="screen relative bg-[url('title_bg.jpg')] bg-[size:100%_100%] bg-center overflow-hidden">
        
        <!-- HTML/CSSによる完全カスタム・タイトルロゴ (新しい画像に文字が含まれるため非表示) -->
        <!--
        <div class="absolute inset-0 pointer-events-none z-10 flex justify-between">
            
            <div class="flex flex-col items-center justify-between h-full pt-12 pb-16 pl-2 md:pl-6">
                <div class="text-xl md:text-2xl font-bold tracking-[0.3em] text-[#3d2314] whitespace-nowrap" style="writing-mode: vertical-rl; text-orientation: upright; text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff;">
                    お兄ちゃんとの、ドキドキ♥じゃんけん勝負
                    <div class="w-px h-16 md:h-24 bg-[#3d2314] mt-8 mx-auto"></div>
                </div>
            </div>

            <div class="flex flex-col items-end pt-8 md:pt-10 pr-4 md:pr-12 lg:pr-24">
                <div class="flex flex-col items-end space-y-1 md:space-y-2">
                    <span class="doujin-title text-4xl md:text-6xl transform rotate-[-4deg] mr-4 md:mr-16 pb-2">妹ももは</span>
                    
                    <div class="flex items-end transform rotate-[-4deg]">
                        <div class="w-8 h-8 md:w-12 md:h-12 rounded-full border-[3px] md:border-[4px] border-[#4A2E1B] bg-[#FF6593] text-white flex items-center justify-center text-lg md:text-xl font-black mr-2 md:mr-3 mb-2 md:mb-3 shadow-[0_5px_15px_rgba(0,0,0,0.2)]">と</div>
                        <span class="doujin-title text-6xl md:text-8xl leading-none">じゃんけん</span>
                        <span class="doujin-title-sub text-4xl md:text-6xl ml-2 md:ml-4 mb-1 md:mb-2">する</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- ボタンレイヤー（顔や背景アイコンとの被りを回避するため、少し左上に配置） -->
        <div class="absolute bottom-20 right-12 md:bottom-28 md:right-20 z-20 flex flex-col space-y-4">
            <button onclick="showScreen('select-place-game')" class="btn-pink px-12 py-4 text-xl w-64 shadow-[0_0_15px_rgba(255,255,255,0.5)]">あそぶ</button>
            <button onclick="showScreen('settings')" class="btn-pink px-12 py-4 text-xl w-64 shadow-[0_0_15px_rgba(255,255,255,0.5)]">せってい</button>
            <button onclick="showScreen('select-place-gallery')" class="btn-pink px-12 py-4 text-xl w-64 shadow-[0_0_15px_rgba(255,255,255,0.5)]">ぎゃらりー</button>
            <button onclick="exitGame()" class="btn-pink px-12 py-4 text-xl w-64 shadow-[0_0_15px_rgba(255,255,255,0.5)]">おわる</button>
        </div>
    </div>

    <!-- Location Selection (Game) -->
    <div id="screen-select-place-game" class="screen flex-col items-center justify-center space-y-10 relative">
        <!-- ホバー背景用コンテナ（初期は透明） -->
        <div id="place-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-500 z-0 opacity-0"></div>
        <div class="absolute inset-0 bg-white/30 z-0 backdrop-blur-[2px]"></div> <!-- 全体を少しぼかして文字を見やすく -->

        <h2 class="doujin-heading text-3xl md:text-5xl z-10 text-center mb-4">どこであそびますか？</h2>
        <div class="flex space-x-6 z-10">
            <button onmouseenter="setPlaceBg('bg_room.png')" onmouseleave="clearPlaceBg()" onclick="selectCostumePhase(1)" class="btn-pink w-40 py-6 text-2xl transition-transform hover:scale-105">おへや</button>
            <button onmouseenter="setPlaceBg('bg_classroom.png')" onmouseleave="clearPlaceBg()" onclick="selectCostumePhase(2)" class="btn-pink w-40 py-6 text-2xl transition-transform hover:scale-105">きょうしつ</button>
            <button onmouseenter="setPlaceBg('bg_park.png')" onmouseleave="clearPlaceBg()" onclick="selectCostumePhase(3)" class="btn-pink w-40 py-6 text-2xl transition-transform hover:scale-105">こうえん</button>
        </div>
        <button onclick="showScreen('title')" class="btn-pink px-12 py-3 mt-12 z-10">もどる</button>
    </div>
    
    <script>
        function setPlaceBg(imageUrl) {
            const bg = document.getElementById('place-bg');
            bg.style.backgroundImage = `url(${imageUrl})`;
            bg.style.opacity = '0.7'; // 画像をフワッと表示
        }
        function clearPlaceBg() {
            const bg = document.getElementById('place-bg');
            bg.style.opacity = '0'; // ホバーが外れたらフワッと消える
        }
    </script>

    <!-- Costume Selection -->
    <div id="screen-select-costume" class="screen flex-col items-center justify-center space-y-10">
        <h2 class="doujin-heading text-3xl md:text-5xl text-center mb-4">どのコスチュームで遊ぶ？</h2>
        <div id="costume-list" class="flex justify-center items-end space-x-4 w-full px-4 max-w-7xl">
            <!-- 5つのコスチュームオプション（JSでバッジ制御） -->
            <div id="costume-opt-1" onclick="startGame(1)" class="costume-option p-2 flex flex-col items-center">
                <div id="badge-1" class="clear-badge hidden">クリア！</div>
                <img id="cos-img-1" src="" class="h-64 md:h-80 object-cover mb-4 doujin-frame" alt="1番目">
                <span class="doujin-label text-xl md:text-2xl mt-2">1番目</span>
            </div>
            <div id="costume-opt-2" onclick="startGame(2)" class="costume-option p-2 flex flex-col items-center">
                <div id="badge-2" class="clear-badge hidden">クリア！</div>
                <img id="cos-img-2" src="" class="h-64 md:h-80 object-cover mb-4 doujin-frame" alt="2番目">
                <span class="doujin-label text-xl md:text-2xl mt-2">2番目</span>
            </div>
            <div id="costume-opt-3" onclick="startGame(3)" class="costume-option p-2 flex flex-col items-center">
                <div id="badge-3" class="clear-badge hidden">クリア！</div>
                <img id="cos-img-3" src="" class="h-64 md:h-80 object-cover mb-4 doujin-frame" alt="3番目">
                <span class="doujin-label text-xl md:text-2xl mt-2">3番目</span>
            </div>
            <div id="costume-opt-4" onclick="startGame(4)" class="costume-option p-2 flex flex-col items-center">
                <div id="badge-4" class="clear-badge hidden">クリア！</div>
                <img id="cos-img-4" src="" class="h-64 md:h-80 object-cover mb-4 doujin-frame" alt="4番目">
                <span class="doujin-label text-xl md:text-2xl mt-2">4番目</span>
            </div>
            <div id="costume-opt-5" onclick="startGame(5)" class="costume-option p-2 flex flex-col items-center">
                <div id="badge-5" class="clear-badge hidden">クリア！</div>
                <img id="cos-img-5" src="" class="h-64 md:h-80 object-cover mb-4 doujin-frame" alt="5番目">
                <span class="doujin-label text-xl md:text-2xl mt-2">5番目</span>
            </div>
        </div>
        <button onclick="showScreen('select-place-game')" class="btn-pink px-12 py-3 mt-4">もどる</button>
    </div>

    <!-- Janken Game Screen -->
    <div id="screen-game" class="screen flex-row relative">
        <div id="speed-lines" class="speed-lines"></div>
        <div class="w-1/2 flex items-center justify-center bg-white/50 relative">
            <div id="char-container" class="text-center relative overflow-hidden">
                <img id="main-character" src="" class="character-img" alt="ももは">
                <!-- 夜の部屋用の光演出（ビル・ランプ・キラキラ） -->
                <div class="building-glow"></div>
                <div class="lamp-glow"></div>
                <div class="sparkle sparkle1"></div>
                <div class="sparkle sparkle2"></div>
                <div class="sparkle sparkle3"></div>
                <div class="sparkle sparkle4"></div>
                <div class="sparkle sparkle5"></div>
                <div class="sparkle sparkle6"></div>
                <div class="sparkle sparkle7"></div>
                <div class="sparkle sparkle8"></div>
                <div class="sparkle sparkle9"></div>
                <div class="sparkle sparkle10"></div>
                
                <!-- 教室用の光の粒子（埃） -->
                <div class="dust dust1"></div>
                <div class="dust dust2"></div>
                <div class="dust dust3"></div>
                <div class="dust dust4"></div>
                <div class="dust dust5"></div>
                <div class="dust dust6"></div>
                <div class="dust dust7"></div>
                <div class="dust dust8"></div>
                <div class="dust dust9"></div>
                <div class="dust dust10"></div>
                
                <!-- 公園用の桜の花びら -->
                <div class="petal petal1"></div>
                <div class="petal petal2"></div>
                <div class="petal petal3"></div>
                <div class="petal petal4"></div>
                <div class="petal petal5"></div>
                <div class="petal petal6"></div>
                <div class="petal petal7"></div>
                <div class="petal petal8"></div>
                <div class="petal petal9"></div>
                <div class="petal petal10"></div>
            </div>
        </div>

        <div class="w-1/2 flex flex-col p-4 relative">
            <button onclick="showScreen('title')" class="absolute top-4 right-4 btn-pink px-6 py-2 z-10">もどる</button>

            <!-- Momoha Life (Top) -->
            <div class="flex flex-col items-center mb-2">
                <p class="font-bold text-lg mb-1">ももはのライフ</p>
                <div id="cpu-hearts" class="flex"></div>
            </div>

            <!-- Main Game Area -->
            <div class="flex-1 flex flex-col items-center justify-center space-y-4">
                <div id="result-display" class="flex items-center space-x-12 h-20 invisible">
                    <div id="cpu-hand" class="text-6xl">✊</div>
                    <div class="text-3xl font-black">VS</div>
                    <div id="player-hand" class="text-6xl">✊</div>
                </div>

                <div id="msg-window-container" class="message-window shadow-inner">
                    <p id="game-message" class="text-2xl font-bold">これからはじめるよ？</p>
                    <div class="flex justify-end">
                        <button id="next-btn" onclick="nextStep()" class="btn-pink px-8 py-2 text-lg">すすむ</button>
                    </div>
                </div>

                <div class="flex justify-center my-2">
                    <button id="skill-btn" onclick="useSkill()" class="btn-pink px-6 py-2 text-lg font-bold hidden">おねだり（のこり1回）</button>
                </div>

                <div id="controls" class="flex space-x-6 opacity-30 pointer-events-none transition-opacity">
                    <button onclick="play(0)" class="btn-pink w-24 h-24 flex flex-col items-center justify-center">
                        <span class="text-4xl">✊</span>
                        <span class="font-bold mt-1">グー</span>
                    </button>
                    <button onclick="play(1)" class="btn-pink w-24 h-24 flex flex-col items-center justify-center">
                        <span class="text-4xl">✌️</span>
                        <span class="font-bold mt-1">チョキ</span>
                    </button>
                    <button onclick="play(2)" class="btn-pink w-24 h-24 flex flex-col items-center justify-center">
                        <span class="text-4xl">✋</span>
                        <span class="font-bold mt-1">パー</span>
                    </button>
                </div>

                <div id="game-over-area" class="hidden text-center space-y-6">
                    <h2 id="final-result-text" class="text-4xl font-bold text-pink-600"></h2>
                    <p id="final-sub-text" class="text-xl"></p>
                    <button onclick="resetGame()" class="btn-pink px-12 py-4 text-xl">もういちど遊ぶ</button>
                    <button onclick="showScreen('select-costume')" class="btn-pink px-12 py-4 text-xl ml-4">コスチュームをえらぶ</button>
                </div>
            </div>

            <!-- Player Life (Bottom) -->
            <div class="flex flex-col items-center mt-2">
                <div id="player-hearts" class="flex"></div>
                <p class="font-bold text-lg mt-1">あなたのライフ</p>
            </div>
        </div>
    </div>

    <!-- Settings Screen -->
    <div id="screen-settings" class="screen flex-col items-center justify-center space-y-8">
        <h2 class="text-4xl font-bold">せってい</h2>
        <div class="flex flex-col space-y-4 w-80">
            <button id="btn-mode-normal" onclick="setMode('normal')" class="btn-pink py-4 text-xl border-4">つうじょう</button>
            <button id="btn-mode-player" onclick="setMode('player')" class="btn-pink py-4 text-xl">ぷれいやーがかつ</button>
            <button id="btn-mode-cousin" onclick="setMode('cousin')" class="btn-pink py-4 text-xl">ももはがかつ</button>
        </div>
        <button onclick="showScreen('title')" class="btn-pink px-12 py-3 mt-8">もどる</button>
    </div>

    <!-- Gallery Selection Screen -->
    <div id="screen-select-place-gallery" class="screen flex-col items-center justify-center space-y-10">
        <h2 class="text-4xl font-bold">どのぎゃらりーをみますか？</h2>
        <div class="flex space-x-6">
            <button id="gal-btn-1" onclick="openGallery(1)" class="btn-pink w-40 py-6 text-2xl">おへや</button>
            <button id="gal-btn-2" onclick="openGallery(2)" class="btn-pink w-40 py-6 text-2xl">きょうしつ</button>
            <button id="gal-btn-3" onclick="openGallery(3)" class="btn-pink w-40 py-6 text-2xl">こうえん</button>
        </div>
        <button onclick="showScreen('title')" class="btn-pink px-12 py-3 mt-12">もどる</button>
    </div>

    <!-- Gallery View Screen -->
    <div id="screen-gallery" class="screen flex-col items-center p-8">
        <div class="flex justify-between w-full max-w-6xl mb-4 z-10">
            <h2 id="gallery-title" class="text-4xl font-bold">ぎゃらりー</h2>
            <button onclick="showScreen('select-place-gallery')" class="btn-pink px-8 py-2">場所をえらびなおす</button>
        </div>
        <div class="flex-1 w-full max-w-6xl">
            <div class="gallery-slide-container">
                <button onclick="prevOmake()" class="btn-pink left-8 w-16 h-16 text-3xl">←</button>
                <div class="flex flex-col items-center">
                    <div class="relative inline-block">
                        <img id="omake-display" src="" class="gallery-image" alt="おまけイラスト">
                        <div id="magnifier" class="magnifier hidden"></div>
                    </div>
                    <p id="omake-label" class="mt-4 text-3xl font-bold text-pink-600">No. 0</p>
                </div>
                <button onclick="nextOmake()" class="btn-pink right-8 w-16 h-16 text-3xl">→</button>
            </div>
        </div>
    </div>

    <audio id="bgm" src="audio/bgm.mp3" loop></audio>
    <script src="js/audioList.js"></script>
    <script src="js/model.js"></script>
    <script src="js/view.js"></script>
    <script src="js/presenter.js"></script>
    <script src="js/main_game.js"></script>
</body>
</html>
