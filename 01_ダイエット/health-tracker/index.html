<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヘルスケア・ライフログ・トラッカー</title>
    <!-- Google Fonts の読み込み（モダンな書体） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons (美しいアイコンライブラリ) の読み込み -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js (美しいグラフ描画ライブラリ) の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- スタイルシートの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-decorations">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <div class="app-container">
        <!-- ヘッダー部分 -->
        <header class="app-header">
            <div class="logo-area">
                <i data-lucide="heart-pulse" class="header-icon"></i>
                <h1>ヘルスケア・ライフログ</h1>
            </div>
            <p class="subtitle">毎日の健康を美しく記録する</p>
        </header>

        <!-- 日付選択・ナビゲーション -->
        <section class="date-selector-card glass-panel">
            <button id="prev-date-btn" class="icon-btn" title="前日">
                <i data-lucide="chevron-left"></i>
            </button>
            <div class="date-display-wrapper">
                <i data-lucide="calendar" class="calendar-icon"></i>
                <input type="date" id="date-picker" class="date-input">
            </div>
            <button id="next-date-btn" class="icon-btn" title="翌日">
                <i data-lucide="chevron-right"></i>
            </button>
        </section>

        <!-- メインコンテンツグリッド -->
        <main class="main-grid">
            <!-- 入力フォームエリア -->
            <section class="input-section glass-panel">
                <div class="section-header">
                    <div class="section-title-wrapper">
                        <i data-lucide="edit-3" class="title-icon"></i>
                        <h2>今日の記録を入力</h2>
                    </div>
                    <div class="autosave-badge" id="autosave-badge">
                        <i data-lucide="refresh-cw" class="spin-icon"></i>
                        <span>自動保存中</span>
                    </div>
                </div>

                <form id="tracker-form" onsubmit="return false;">
                    <!-- バイタル・運動グループ (最上部に移動) -->
                    <div class="form-group-title vital-theme-border">
                        <i data-lucide="activity"></i>
                        <h3>バイタル＆活動</h3>
                    </div>

                    <div class="vitals-container">
                        <!-- 身体データ（バイタル）入力グリッド -->
                        <div class="vitals-body-grid">
                            <!-- 体重入力 -->
                            <div class="input-wrapper">
                                <label for="weight-input">体重 (kg)</label>
                                <div class="number-input-container">
                                    <input type="number" id="weight-input" step="0.1" min="20" max="200" placeholder="0.0">
                                    <span class="unit">kg</span>
                                </div>
                            </div>

                            <!-- 体脂肪率入力 -->
                            <div class="input-wrapper">
                                <label for="bodyfat-input">体脂肪率 (%)</label>
                                <div class="number-input-container">
                                    <input type="number" id="bodyfat-input" step="0.1" min="1" max="60" placeholder="0.0">
                                    <span class="unit">%</span>
                                </div>
                            </div>

                            <!-- 皮下脂肪率入力 -->
                            <div class="input-wrapper">
                                <label for="subcutaneous-fat-input">皮下脂肪率 (%)</label>
                                <div class="number-input-container">
                                    <input type="number" id="subcutaneous-fat-input" step="0.1" min="1" max="60" placeholder="0.0">
                                    <span class="unit">%</span>
                                </div>
                            </div>

                            <!-- 血圧入力 -->
                            <div class="input-wrapper">
                                <label for="bp-input">血圧 (最高/最低)</label>
                                <div class="number-input-container">
                                    <input type="text" id="bp-input" placeholder="120/80">
                                    <span class="unit">mmHg</span>
                                </div>
                            </div>

                            <!-- BMI入力 -->
                            <div class="input-wrapper">
                                <label for="bmi-input">BMI</label>
                                <div class="number-input-container">
                                    <input type="number" id="bmi-input" step="0.1" min="10" max="50" placeholder="0.0">
                                    <span class="unit"></span>
                                </div>
                            </div>

                            <!-- ウエスト入力 -->
                            <div class="input-wrapper">
                                <label for="waist-input">ウエスト (cm)</label>
                                <div class="number-input-container">
                                    <input type="number" id="waist-input" step="0.1" min="40" max="150" placeholder="0.0">
                                    <span class="unit">cm</span>
                                </div>
                            </div>

                            <!-- 内臓脂肪レベル入力 -->
                            <div class="input-wrapper">
                                <label for="visceral-fat-input">内臓脂肪</label>
                                <div class="number-input-container">
                                    <input type="number" id="visceral-fat-input" step="0.5" min="1" max="30" placeholder="0.0">
                                    <span class="unit">レベル</span>
                                </div>
                            </div>

                            <!-- 骨格筋率入力 -->
                            <div class="input-wrapper">
                                <label for="muscle-input">骨格筋率 (%)</label>
                                <div class="number-input-container">
                                    <input type="number" id="muscle-input" step="0.1" min="5" max="70" placeholder="0.0">
                                    <span class="unit">%</span>
                                </div>
                            </div>

                            <!-- 基礎代謝入力 -->
                            <div class="input-wrapper">
                                <label for="metabolism-input">基礎代謝 (kcal)</label>
                                <div class="number-input-container">
                                    <input type="number" id="metabolism-input" step="1" min="500" max="4000" placeholder="0">
                                    <span class="unit">kcal</span>
                                </div>
                            </div>

                            <!-- 体内年齢入力 -->
                            <div class="input-wrapper">
                                <label for="body-age-input">体内年齢 (歳)</label>
                                <div class="number-input-container">
                                    <input type="number" id="body-age-input" step="1" min="1" max="120" placeholder="0">
                                    <span class="unit">歳</span>
                                </div>
                            </div>
                        </div>

                        <!-- 活動データ（水分・運動）入力グリッド -->
                        <div class="vitals-activity-grid">
                            <!-- 水分入力 -->
                            <div class="input-wrapper">
                                <label>水分摂取量</label>
                                <div class="water-input-container">
                                    <div class="water-display">
                                        <span id="water-current">0</span>
                                        <span class="unit">/ 2000 ml</span>
                                    </div>
                                    <div class="water-quick-buttons">
                                        <button type="button" class="water-btn" data-amount="200">+200ml</button>
                                        <button type="button" class="water-btn" data-amount="500">+500ml</button>
                                        <button type="button" id="water-reset-btn" class="water-btn reset" title="リセット">
                                            <i data-lucide="rotate-ccw"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- 運動入力 -->
                            <div class="input-wrapper">
                                <label for="exercise-input">運動内容と時間</label>
                                <textarea id="exercise-input" placeholder="例: ウォーキング 30分、ヨガ 15分" rows="3"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 食事記録グループ (下部に移動＆プルダウン化) -->
                    <div class="form-group-title meal-theme-border">
                        <i data-lucide="utensils"></i>
                        <h3>食事の記録 (PFC・カロリー)</h3>
                    </div>
                    
                    <div class="meals-grid select-layout">
                        <!-- 朝食 -->
                        <div class="input-wrapper">
                            <label>朝食</label>
                            <div class="meal-add-row">
                                <select id="meal-breakfast" class="meal-select">
                                    <!-- JSでオプションを挿入します -->
                                </select>
                                <button type="button" id="add-breakfast-btn" class="meal-add-btn" title="朝食に追加">
                                    ➕
                                </button>
                            </div>
                            <!-- 追加した食事のリスト表示エリア -->
                            <div id="breakfast-list" class="meal-item-list"></div>
                            <!-- 朝食合計の栄養素タグ表示エリア -->
                            <div id="breakfast-nutrition" class="nutrition-display"></div>
                        </div>
                        
                        <!-- 昼食 -->
                        <div class="input-wrapper">
                            <label>昼食</label>
                            <div class="meal-add-row">
                                <select id="meal-lunch" class="meal-select">
                                    <!-- JSでオプションを挿入します -->
                                </select>
                                <button type="button" id="add-lunch-btn" class="meal-add-btn" title="昼食に追加">
                                    ➕
                                </button>
                            </div>
                            <div id="lunch-list" class="meal-item-list"></div>
                            <div id="lunch-nutrition" class="nutrition-display"></div>
                        </div>

                        <!-- 晩御飯 -->
                        <div class="input-wrapper">
                            <label>晩御飯</label>
                            <div class="meal-add-row">
                                <select id="meal-dinner" class="meal-select">
                                    <!-- JSでオプションを挿入します -->
                                </select>
                                <button type="button" id="add-dinner-btn" class="meal-add-btn" title="晩御飯に追加">
                                    ➕
                                </button>
                            </div>
                            <div id="dinner-list" class="meal-item-list"></div>
                            <div id="dinner-nutrition" class="nutrition-display"></div>
                        </div>

                        <!-- おやつ -->
                        <div class="input-wrapper">
                            <label>おやつ</label>
                            <div class="meal-add-row">
                                <select id="meal-snack" class="meal-select">
                                    <!-- JSでオプションを挿入します -->
                                </select>
                                <button type="button" id="add-snack-btn" class="meal-add-btn" title="おやつに追加">
                                    ➕
                                </button>
                            </div>
                            <div id="snack-list" class="meal-item-list"></div>
                            <div id="snack-nutrition" class="nutrition-display"></div>
                        </div>
                    </div>
                </form>
            </section>

            <!-- ダッシュボード・視覚化エリア -->
            <section class="dashboard-section">
                <!-- 今日のサマリーカード -->
                <div class="summary-card glass-panel">
                    <div class="section-title">
                        <i data-lucide="pie-chart"></i>
                        <h2>今日のサマリー</h2>
                    </div>
                    <div class="summary-widgets">
                        <div class="widget">
                            <div class="widget-icon water-theme">
                                <i data-lucide="droplet"></i>
                            </div>
                            <div class="widget-info">
                                <span class="widget-label">水分摂取率</span>
                                <span class="widget-value" id="water-pct-text">0%</span>
                                <div class="progress-bar-container">
                                    <div class="progress-bar" id="water-progress" style="width: 0%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="widget weight-widget">
                            <div class="widget-icon weight-theme">
                                <i data-lucide="scale"></i>
                            </div>
                            <div class="widget-info">
                                <span class="widget-label">登録体重</span>
                                <span class="widget-value" id="summary-weight">- kg</span>
                            </div>
                        </div>
                        <div class="vital-details-summary">
                            <div class="vital-detail-card">
                                <span class="detail-label">体脂肪率</span>
                                <span class="detail-value" id="summary-bodyfat">- %</span>
                            </div>
                            <div class="vital-detail-card">
                                <span class="detail-label">血圧</span>
                                <span class="detail-value" id="summary-bp">- mmHg</span>
                            </div>
                            <div class="vital-detail-card">
                                <span class="detail-label">BMI</span>
                                <span class="detail-value" id="summary-bmi">-</span>
                            </div>
                            <div class="vital-detail-card">
                                <span class="detail-label">ウエスト</span>
                                <span class="detail-value" id="summary-waist">- cm</span>
                            </div>
                        </div>
                        <!-- 今日の総カロリー＆PFC -->
                        <div class="widget pfc-summary-widget">
                            <div class="widget-icon calorie-theme">
                                <i data-lucide="flame"></i>
                            </div>
                            <div class="pfc-summary-content">
                                <div class="calorie-total-row">
                                    <span class="widget-label">総摂取カロリー</span>
                                    <span class="widget-value" id="total-calories">0 kcal</span>
                                </div>
                                <div class="pfc-bar-chart">
                                    <div class="pfc-segment p-seg" id="p-bar" style="width: 0%" title="たんぱく質"></div>
                                    <div class="pfc-segment f-seg" id="f-bar" style="width: 0%" title="脂質"></div>
                                    <div class="pfc-segment c-seg" id="c-bar" style="width: 0%" title="炭水化物"></div>
                                </div>
                                <div class="pfc-legend-labels">
                                    <span class="p-label">P 🥩 たんぱく質: <b id="total-p">0</b>g</span>
                                    <span class="f-label">F 🧈 脂質: <b id="total-f">0</b>g</span>
                                    <span class="c-label">C 🍚 炭水化物: <b id="total-c">0</b>g</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- グラフカード -->
                <div class="chart-card glass-panel">
                    <div class="chart-header-container">
                        <div class="section-title">
                            <i data-lucide="trending-up"></i>
                            <h2>推移グラフ</h2>
                        </div>
                        <div class="chart-tabs-container">
                            <button type="button" class="chart-tab active" data-tab="weight">体重</button>
                            <button type="button" class="chart-tab" data-tab="bodyfat">体脂肪率</button>
                            <button type="button" class="chart-tab" data-tab="bp">血圧</button>
                            <button type="button" class="chart-tab" data-tab="waist">ウエスト</button>
                            <button type="button" class="chart-tab" data-tab="bmi">BMI</button>
                            <button type="button" class="chart-tab" data-tab="muscle">骨格筋</button>
                            <button type="button" class="chart-tab" data-tab="metabolism">基礎代謝</button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="weightChart"></canvas>
                    </div>
                </div>
            </section>
        </main>

        <!-- 履歴カレンダー・一覧 -->
        <section class="history-section glass-panel">
            <div class="section-title">
                <i data-lucide="history"></i>
                <h2>カレンダーと履歴</h2>
            </div>
            <div class="history-container">
                <div id="calendar-grid" class="calendar-grid">
                    <!-- JSでカレンダーを描画します -->
                </div>
                <div class="history-list-wrapper">
                    <h3>最近の記録</h3>
                    <div id="history-list" class="history-list">
                        <!-- JSで履歴リストを描画します -->
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- JavaScript の読み込み -->
    <script src="script.js"></script>
    <script>
        // Lucideアイコンの初期化
        lucide.createIcons();
    </script>
</body>
</html>
